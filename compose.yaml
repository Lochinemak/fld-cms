# Local development infrastructure. Host ports avoid the default 5432/6379.
name: fld-asset

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fld}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-fld_asset}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-15432}:5432'
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/docker.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_PORT:-16379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible storage for STORAGE_DRIVER=s3 and its tests. Starts only with the s3 profile:
  # docker compose --profile s3 up -d. Console at http://localhost:19001.
  rustfs:
    image: rustfs/rustfs:1.0.4
    profiles: [s3]
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-fld-dev}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-fld-dev-secret}
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - '127.0.0.1:${RUSTFS_PORT:-19000}:9000'
      - '127.0.0.1:${RUSTFS_CONSOLE_PORT:-19001}:9001'
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:9000/health']
      interval: 5s
      timeout: 3s
      retries: 20

  # Catches every mail the app sends, for SMTP_HOST=localhost SMTP_PORT=11025 SMTP_SECURITY=none.
  # Starts only with the mail profile: docker compose --profile mail up -d. Inbox at
  # http://localhost:18025.
  mailpit:
    image: axllent/mailpit:v1.33.1
    profiles: [mail]
    restart: unless-stopped
    environment:
      # Takes any username and password, so an SMTP login set on the settings page works too.
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-11025}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-18025}:8025'

volumes:
  postgres-data:
  redis-data:
  rustfs-data:
